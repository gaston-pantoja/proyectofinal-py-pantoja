{% extends 'core/base.html' %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto; padding: 2rem; background-color: #1a1a1a; border-radius: 6px; border: 1px solid #333;">
    <h2 style="color: #00ffcc; margin-top: 0; text-align: center; margin-bottom: 1.5rem;">Actualizar Credenciales</h2>
    
    <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #ff9900; color: #121212; padding: 0.7rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">
            Modificar Password
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{% url 'perfil' %}" style="color: #aaa; text-decoration: none; font-size: 0.9rem;">← Cancelar y volver al perfil</a>
    </div>
</div>
{% endblock %}
