{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; padding: 2rem; background-color: #1a1a1a; border-radius: 6px; border: 1px solid #333;">
    <h2 style="color: #00ffcc; margin-top: 0; text-align: center; margin-bottom: 1.5rem;">Control de Acceso</h2>

    {% if messages %}
    <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 400px; margin: 0 auto 1.5rem auto;">
        {% for message in messages %}
            <div style="background-color: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc; padding: 0.75rem; border-radius: 4px; font-size: 0.85rem; text-align: center; box-sizing: border-box;">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
    
    <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #00ffcc; color: #121212; padding: 0.7rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">
            Autenticar
        </button>
    </form>

    <p style="color: #888; font-size: 0.9rem; text-align: center; margin-top: 1.5rem;">
        ¿No tienes usuario? <a href="{% url 'registro' %}" style="color: #ff9900; text-decoration: none;">Regístrate acá</a>
    </p>
</div>
{% endblock %}
