<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma Vanguardia{% endblock %}</title>
    
    {% load static %}
    
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body>

    <nav>
        <a href="{% url 'home' %}">Inicio</a>
        <a href="{% url 'about' %}">Acerca de mí</a>
        <a href="{% url 'pages_index' %}">Blogs</a>
        
        {% if user.is_authenticated %}
            <span style="color: #00ffcc; float: right; font-size: 0.9rem;">
                Conectado como: <strong>{{ user.username }}</strong>
            </span>
        {% else %}
            <a href="{% url 'admin:index' %}" style="float: right; color: #777;">Iniciar Sesión</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Innovación y Sostenibilidad Industrial. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
