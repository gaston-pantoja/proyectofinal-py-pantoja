<!DOCTYPE html>
<html lang="es" style="height: 100%; margin: 0; padding: 0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma Vanguardia{% endblock %}</title>
    
    {% load static %}
    
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body style="margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; background-color: #121212; color: #fff;">

    <nav>
        <a href="{% url 'home' %}">Inicio</a>
        <a href="{% url 'about' %}">Acerca de mí</a>
        <a href="{% url 'pages_index' %}">Blogs</a>
    
        {% if user.is_authenticated %}
            <a href="/admin/core/proyecto/add/" style="background-color: #00ffcc; color: #121212; padding: 0.3rem 0.8rem; border-radius: 4px; font-weight: bold; margin-left: 1rem; font-size: 0.85rem;">
            + Crear Blog
            </a>

            <div style="float: right; display: flex; gap: 1.5rem; align-items: center;">
                <a href="{% url 'bandeja' %}" style="color: #ff9900; font-size: 0.9rem; text-decoration: none;">
                    Mensajes 
                </a>    
                <a href="{% url 'perfil' %}" style="color: #00ffcc; font-size: 0.9rem; text-decoration: none;"> <span>⚙️</span>
                    Configuración 
                </a>

                <form action="{% url 'logout' %}" method="POST" style="display: inline; margin: 0; padding: 0;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: #ff3333; font-size: 0.9rem; font-family: inherit; cursor: pointer; padding: 0; text-decoration: none; font-weight: normal;">
                    Cerrar Sesión
                    </button>
                </form>
            </div>
        {% else %}
            <div style="float: right; display: flex; gap: 1.5rem;">
                <a href="{% url 'login' %}" style="color: #00ffcc; text-decoration: none;">Iniciar Sesión</a>
                <a href="{% url 'registro' %}" style="color: #777; text-decoration: none;">Registrarse</a>
            </div>
        {% endif %}
    </nav>

    <main style="flex-grow: 1; display: flex; flex-direction: column; width: 100%;">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer style="width: 100%; background-color: #1a1a1a; border-top: 1px solid #333; padding: 1.5rem 0; text-align: center;">
        <p style="margin: 0; color: #888; font-size: 0.85rem;">
            © 2026 Innovación y Sostenibilidad Industrial. Todos los derechos reservados.
        </p>
    </footer>

</body>
</html>
