{% extends 'core/base.html' %}

{% block title %}Gestionar Publicación - Plataforma Vanguardia{% endblock %}

{% block content %}
<style>
    .django-form-container p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }
    .django-form-container label {
        color: #00ffcc;
        font-weight: bold;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    /* Estilizado para los inputs de texto y textareas (CKEditor o clásicos) */
    .django-form-container input[type="text"], 
    .django-form-container textarea {
        width: 100%;
        padding: 0.75rem;
        background-color: #222;
        border: 1px solid #444;
        border-radius: 4px;
        color: #fff;
        font-family: inherit;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.3s ease;
    }
    .django-form-container input[type="text"]:focus, 
    .django-form-container textarea:focus {
        border-color: #00ffcc;
        outline: none;
    }
    /* Estilizado específico para el botón nativo de subir imagen */
    .django-form-container input[type="file"] {
        color: #ccc;
        font-size: 0.9rem;
        padding: 0.5rem 0;
    }
</style>

<div style="max-width: 650px; margin: 3rem auto; padding: 2.5rem; background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    
    <h2 style="color: #00ffcc; margin-top: 0; margin-bottom: 2rem; font-size: 1.8rem; display: flex; align-items: center; gap: 0.5rem;">
        {% if object %}✏️ Editar Publicación{% else %}✨ Crear Nueva Publicación{% endif %}
    </h2>

    <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column;">
        {% csrf_token %}
        
        <div class="django-form-container" style="color: #fff;">
            {{ form.as_p }}
        </div>

        <div style="display: flex; align-items: center; gap: 1.5rem; margin-top: 1rem; border-top: 1px solid #333; padding-top: 1.5rem;">
            <button type="submit" style="background-color: #00ffcc; color: #121212; border: none; padding: 0.8rem 1.8rem; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.95rem; transition: transform 0.2s ease;">
                💾 Guardar Cambios
            </button>
            <a href="{% url 'pages_index' %}" style="color: #aaa; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s ease;">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
